plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
version = '1.0.0-dev'
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
}
tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
processResources {
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand 'version': version }
}
jar { from(rootProject.file('LICENSE')); from(rootProject.file('NOTICE')) }
tasks.register('createFixture', JavaExec) {
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'mcopt.replay.Fixture'
    jvmArgs '--enable-native-access=ALL-UNNAMED', '-Xmx2G'
    if (project.hasProperty('fixtureOutput')) args rootProject.file(project.property('fixtureOutput')).absolutePath
    if (project.hasProperty('fixtureSeed')) args project.property('fixtureSeed')
    doFirst {
        workingDir = layout.buildDirectory.dir('fixture-work').get().asFile
        workingDir.mkdirs()
    }
}
